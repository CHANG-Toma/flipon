# FlipOn — infra locale (dev / tests). Ne pas exposer hors machine.
# Usage: npm run db:up

name: flipon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Bind localhost only — pas d’accès LAN / internet
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-flipon}
      # Auth fort + pas de trust réseau
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - flipon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Tuning léger local (perf + empreinte mémoire raisonnable)
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=500
      - -c
      - password_encryption=scram-sha-256
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /run

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --protected-mode
      - "yes"
      - --bind
      - "0.0.0.0"
    volumes:
      - flipon_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true

volumes:
  flipon_pg_data:
  flipon_redis_data:
